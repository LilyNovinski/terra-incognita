<style>
:root{--sea1:#bdeef0;--sea2:#69c9d3;--deep:#0e5866;--deep2:#0a4652;--paper:#fffaf0;--paper2:#fbf0d9;--edge:#ead6ae;--edge2:#d8bd88;--txt:#3b2a1b;--mut:#8a7660;--acc:#ff8a3d;--acc-d:#d9661f;--acc2:#ffb15c;--ink:#1d8e6c;--sur:#d9661f;--ear:#5869b5;--bad:#d64b3c;--gold:#f2b84b}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;color:var(--txt);font:16px/1.5 Nunito,Rubik,system-ui,"Segoe UI","PingFang SC","Microsoft YaHei","Noto Sans SC",sans-serif}
body{min-height:100vh;background:var(--sea2) var(--seabg,none) center top/cover fixed}
body::before{content:"";position:fixed;inset:0;background:linear-gradient(180deg,#c9f3f2cc 0%,#8fdbe0aa 45%,#4fb8c6cc 100%);pointer-events:none;z-index:-1}
#app{max-width:700px;margin:0 auto;padding:12px 16px 120px}
h1,h2,h3,.serif{font-family:Fredoka,Rubik,Nunito,"PingFang SC","Microsoft YaHei","Noto Sans SC",sans-serif;font-weight:600;margin:0;color:var(--txt)}
h1{font-size:44px;letter-spacing:.2px;line-height:1.05}
h2{font-size:26px}
h3{font-size:19px}
p{margin:0}
.mut{color:var(--mut);font-size:14px}
.c{text-align:center}
.who{color:var(--acc-d)}
.card{background:var(--paper);border:2px solid var(--edge);border-radius:22px;padding:18px;margin:14px 0;box-shadow:0 4px 0 var(--edge2),0 14px 30px #0e586622}
.card.flat{background:var(--paper2);box-shadow:0 3px 0 var(--edge)}
label{display:block;color:var(--mut);font-size:14px;font-weight:700;margin:12px 0 6px}
input,textarea{width:100%;background:#fff;border:2px solid var(--edge);border-radius:14px;color:var(--txt);padding:12px 14px;font:inherit}
input:focus,textarea:focus{outline:none;border-color:var(--acc);box-shadow:0 0 0 4px #ff8a3d22}
textarea{min-height:90px;resize:vertical}
button{font:600 16px Fredoka,Nunito,sans-serif;cursor:pointer;border-radius:16px;border:2px solid var(--edge);background:#fff;color:var(--txt);padding:11px 16px;box-shadow:0 4px 0 var(--edge2);transition:transform .1s,box-shadow .1s,background .2s,border-color .2s}
button:hover{background:#fffdf7;border-color:var(--edge2)}
button:active{transform:translateY(3px);box-shadow:0 1px 0 var(--edge2)}
button:disabled{opacity:.45;cursor:not-allowed;transform:none}
.pri{background:linear-gradient(180deg,var(--acc2),var(--acc));color:#fff;border-color:var(--acc-d);box-shadow:0 5px 0 var(--acc-d),0 10px 20px #d9661f33;text-shadow:0 1px 0 #b8531566;font-size:18px;padding:13px 18px}
.pri:hover{background:linear-gradient(180deg,#ffc070,#ff9748);border-color:var(--acc-d)}
.pri:active{box-shadow:0 2px 0 var(--acc-d)}
.wide{width:100%}
.ghost{background:none;border:none;box-shadow:none;color:var(--deep);font:700 14px Nunito;padding:8px;opacity:.8}
.ghost:hover{background:none;opacity:1;text-decoration:underline}
.ghost:active{transform:none;box-shadow:none}
.row{display:flex;gap:10px;flex-wrap:wrap}.row>*{flex:1}
.sel{border-color:var(--acc)!important;background:#fff1e3!important;color:var(--acc-d);box-shadow:0 4px 0 var(--acc-d)!important}
.opt{display:block;width:100%;text-align:left;margin:9px 0;padding:14px 16px;font:600 17px Nunito}
.err{color:var(--bad);font-size:14px;font-weight:700;min-height:18px;margin-top:6px}
.q{font:600 25px/1.3 Fredoka,Nunito,sans-serif;margin:6px 0 4px}
.tag{font:700 11px Nunito;padding:3px 10px;border-radius:99px;white-space:nowrap}
.t-ink{background:#d7f3e9;color:var(--ink)}.t-sur{background:#ffe6d2;color:var(--sur)}.t-ear{background:#e3e7fb;color:var(--ear)}.t-door{background:#ece6dc;color:#7b6f60}
.dot{width:12px;height:12px;border-radius:50%;display:inline-block;flex:none;box-shadow:0 0 0 2px #fff}
.chip{display:inline-flex;align-items:center;gap:7px;padding:6px 12px;border-radius:99px;background:var(--paper);border:2px solid var(--edge);font:700 14px Nunito;box-shadow:0 2px 0 var(--edge2)}
.chip.me{border-color:var(--acc)}
.chip.off{opacity:.45}
.chip .role{font-size:13px}
/* bandeau */
.top{display:flex;align-items:center;gap:10px;padding:8px 10px 8px 8px;margin:4px 0 12px;background:linear-gradient(180deg,#127083,var(--deep));border-radius:20px;box-shadow:0 4px 0 var(--deep2),0 12px 24px #0a465233;color:#fff}
.brand{font:600 21px Fredoka,sans-serif;flex:1;display:flex;align-items:center;gap:10px;white-space:nowrap;color:#fff}
.brand i,h1 i{font-style:normal;color:var(--gold)}
.brand img{width:40px;height:40px;border-radius:12px;box-shadow:0 2px 6px #0004}
.code{font:700 14px Nunito;letter-spacing:3px;padding:6px 11px;border:2px dashed #ffffff66;border-radius:12px;color:#ffe2a6;background:#ffffff14;box-shadow:none}
.code:hover{background:#ffffff26;border-color:#fff}
.icon{width:38px;height:38px;padding:0;border-radius:50%;display:grid;place-items:center;font-size:16px;background:#ffffff1f;border:2px solid #ffffff40;color:#fff;box-shadow:none}
.icon:hover{background:#ffffff33;border-color:#fff}
.players{display:flex;gap:7px;flex-wrap:wrap;margin-bottom:6px}
/* barre d'indication */
.hint{position:fixed;left:0;right:0;bottom:0;padding:12px 16px calc(14px + env(safe-area-inset-bottom));pointer-events:none;z-index:5}
.hint>div{max-width:668px;margin:0 auto;background:var(--paper);border:2px solid var(--edge);border-radius:20px;padding:12px 16px;display:flex;align-items:center;gap:12px;pointer-events:auto;box-shadow:0 4px 0 var(--edge2),0 12px 30px #0e586640;font-weight:600}
.hint.mine>div{border-color:var(--acc);box-shadow:0 4px 0 var(--acc-d),0 12px 30px #d9661f44}
.hint .pulse{width:11px;height:11px;border-radius:50%;background:var(--edge2);flex:none}
.hint.mine .pulse{background:var(--acc);animation:pu 1.4s infinite}
.hint button{padding:8px 16px;font-size:16px}
@keyframes pu{0%{box-shadow:0 0 0 0 #ff8a3d99}70%{box-shadow:0 0 0 9px #ff8a3d00}}
/* carte */
.map{border-radius:22px;overflow:hidden;border:3px solid #fff;box-shadow:0 5px 0 var(--edge2),0 16px 34px #0e586633;background:#2fb3c0}
.map svg{width:100%;display:block;touch-action:manipulation}
.reg{cursor:default}
.reg .hot{fill:transparent;stroke:none}
.reg.open{cursor:pointer}
.reg.open .hot{stroke:#fff;stroke-width:5;stroke-dasharray:14 10;animation:da 1.6s linear infinite;filter:drop-shadow(0 0 6px #ffb15c)}
.reg.open:hover .hot,.reg.pick .hot{stroke:var(--acc);stroke-width:7;stroke-dasharray:none;fill:#ffffff22}
@keyframes da{to{stroke-dashoffset:-48}}
.fog{transition:opacity 1.6s,transform 1.6s;transform-box:fill-box;transform-origin:center}
.fog.drift{animation:drift 9s ease-in-out infinite alternate}
.fog.clearing{animation:clear 1.8s ease-out forwards}
@keyframes drift{to{transform:translateX(10px) scale(1.02)}}
@keyframes clear{to{opacity:0;transform:scale(1.35) translateY(-20px)}}
.pin{animation:pop .5s cubic-bezier(.3,1.6,.5,1) both;transform-box:fill-box;transform-origin:center}
@keyframes pop{from{transform:scale(0)}}
.lbl rect{fill:#fffaf0;stroke:#d8bd88;stroke-width:2}
.lbl text{font:700 22px Fredoka,Nunito,sans-serif;fill:#3b2a1b}
.lbl.lock rect{fill:#fffaf0cc;stroke:#fff8}
.lbl.lock text{fill:#8a7660}
/* onglets */
.tabs{display:flex;gap:8px;overflow-x:auto;margin:4px 0 10px;padding:2px 2px 6px}
.tabs button{flex:none;display:flex;gap:8px;align-items:center;padding:8px 14px;border-radius:99px;font-size:15px}
.sheet{animation:up .35s cubic-bezier(.2,.9,.3,1)}
@keyframes up{from{opacity:0;transform:translateY(14px)}}
.rhead{display:flex;align-items:center;gap:14px}
.badge{flex:none;border-radius:50%;object-fit:cover;box-shadow:0 4px 10px #0a465240}
img.badge{animation:badgein .5s cubic-bezier(.3,1.5,.5,1)}
@keyframes badgein{from{transform:scale(.6) rotate(-12deg);opacity:0}}
/* révélation */
.flip{perspective:800px}
.flip>div{animation:fl .7s cubic-bezier(.3,1.3,.5,1) both}
@keyframes fl{from{transform:rotateX(90deg);opacity:0}}
.guess{display:flex;align-items:center;gap:12px;padding:12px 14px;border-radius:16px;background:#fff;border:2px solid var(--edge);margin:9px 0;font-weight:600}
.guess.ok{border-color:#7fd3b6;background:#effaf5}.guess.no{border-color:#ffc193;background:#fff4ea}
.guess .v{flex:1}
.verdict{font:600 16px Fredoka,sans-serif}
.big-ans{font:600 30px Fredoka,sans-serif;color:var(--acc-d);text-align:center;margin:6px 0}
.val{text-align:center;font:600 40px Fredoka,sans-serif;color:var(--acc-d)}
.scale{display:flex;justify-content:space-between;color:var(--mut);font-size:13px;font-weight:700}
input[type=range]{padding:0;accent-color:var(--acc);height:32px;border:none;background:none;box-shadow:none}
.status{display:flex;gap:7px;flex-wrap:wrap;margin-top:14px}
.status .chip{font-size:13px;padding:4px 10px}
.lm{font-size:14px;padding:9px 0;border-bottom:2px dotted var(--edge);display:flex;gap:10px;align-items:baseline}
.lm:last-child{border:none}
.fade{opacity:.5}
.reacts{display:flex;gap:8px;justify-content:center;margin-top:14px}
.reacts button{font-size:22px;padding:6px 12px;border-radius:99px}
#fx{position:fixed;inset:0;pointer-events:none;z-index:20;overflow:hidden}
.flo{position:absolute;bottom:100px;font-size:34px;animation:flo 2.6s ease-out forwards;filter:drop-shadow(0 3px 4px #0003)}
.flo i{display:block;font:700 11px Nunito;text-align:center;background:#fff;border-radius:99px;padding:0 6px;font-style:normal}
@keyframes flo{0%{transform:translateY(0) scale(.6);opacity:0}15%{opacity:1;transform:translateY(-30px) scale(1.15)}100%{transform:translateY(-380px) scale(1);opacity:0}}
#toast{position:fixed;left:50%;top:16px;transform:translateX(-50%) translateY(-90px);background:var(--paper);border:2px solid var(--edge);box-shadow:0 4px 0 var(--edge2);padding:10px 18px;border-radius:16px;z-index:30;transition:transform .35s;font-weight:700;max-width:90vw}
#toast.on{transform:translateX(-50%) translateY(0)}
/* accueil */
.hero{text-align:center;padding:26px 16px 22px;margin:6px 0 4px;background:linear-gradient(180deg,#127083,var(--deep));border-radius:28px;box-shadow:0 5px 0 var(--deep2),0 18px 40px #0a465240;color:#fff;position:relative;overflow:hidden}
.hero h1{color:#fff;text-shadow:0 3px 0 #0a4652}
.hero .tagline{color:#d6f3f2;font-size:16px;margin-top:8px}
.hero .logo-img{width:140px;height:140px;border-radius:34px;display:block;margin:0 auto;box-shadow:0 6px 0 #0a4652,0 14px 30px #0006;border:4px solid #fff;animation:bob 4s ease-in-out infinite}
@keyframes bob{50%{transform:translateY(-6px) rotate(-1.5deg)}}
.codein{text-transform:uppercase;letter-spacing:8px;text-align:center;font:700 22px Fredoka}
.bigcode{font:600 52px Fredoka;letter-spacing:12px;color:var(--acc-d);text-align:center;margin:4px 0 10px}
/* modale */
.modal{position:fixed;inset:0;background:#0a4652aa;backdrop-filter:blur(3px);z-index:40;display:grid;place-items:center;padding:16px;animation:fi .25s}
@keyframes fi{from{opacity:0}}
.modal>.card{max-width:440px;width:100%;margin:0;text-align:center;animation:up .35s}
.steps{display:flex;gap:7px;justify-content:center;margin:16px 0}
.steps i{width:9px;height:9px;border-radius:9px;background:var(--edge);cursor:pointer;transition:width .45s cubic-bezier(.3,1.6,.5,1),background .3s,transform .3s}
.steps i:hover{transform:scale(1.25)}
.steps i.done{background:#ffc999}
.steps i.on{background:linear-gradient(90deg,var(--acc2),var(--acc));width:24px;box-shadow:0 2px 6px #ff8a3d66}
.tbody{animation:tin .45s cubic-bezier(.2,.9,.3,1.1) both}
.tbody.back{animation-name:tinb}
@keyframes tin{from{opacity:0;transform:translateX(34px)}}
@keyframes tinb{from{opacity:0;transform:translateX(-34px)}}
[dir=rtl] .tbody{animation-name:tinb}[dir=rtl] .tbody.back{animation-name:tin}
.tbody.tout{animation:tout .2s ease-in forwards}
@keyframes tout{to{opacity:0;transform:translateX(-26px)}}
.tbody.tout.back{animation-name:toutb}
@keyframes toutb{to{opacity:0;transform:translateX(26px)}}
[dir=rtl] .tbody.tout{animation-name:toutb}[dir=rtl] .tbody.tout.back{animation-name:tout}
.modal.closing{animation:fo .25s forwards}.modal.closing>.card{animation:dn .25s forwards}
@keyframes fo{to{opacity:0}}@keyframes dn{to{transform:translateY(20px) scale(.96)}}
.banner{text-align:center;padding:22px 10px 8px}
.banner .serif{font-size:32px;color:var(--deep);text-shadow:0 2px 0 #fff}
.banner .mut{color:var(--deep);opacity:.85;font-weight:600}
/* ===== Animations subtiles ===== */
#sky{position:fixed;inset:0;pointer-events:none;z-index:-1;overflow:hidden}
#sky .glow{position:absolute;inset:-30%;background:radial-gradient(40% 30% at 30% 30%,#ffffff40,transparent 70%),radial-gradient(35% 25% at 75% 65%,#ffffff2e,transparent 70%);animation:sway 22s ease-in-out infinite alternate}
@keyframes sway{to{transform:translate(6%,4%) rotate(4deg)}}
#sky i{position:absolute;bottom:-12px;border-radius:50%;background:#fff;opacity:0;animation:bubble linear infinite}
@keyframes bubble{8%{opacity:.55}85%{opacity:.25}100%{transform:translate(var(--dx),-108vh);opacity:0}}
section>*{animation:rise .55s cubic-bezier(.2,.9,.3,1.1) both}
section>*:nth-child(2){animation-delay:.07s}section>*:nth-child(3){animation-delay:.14s}section>*:nth-child(4){animation-delay:.21s}section>*:nth-child(5){animation-delay:.28s}section>*:nth-child(n+6){animation-delay:.34s}
@keyframes rise{from{opacity:0;transform:translateY(16px) scale(.985)}}
.opt{animation:rise .45s cubic-bezier(.2,.9,.3,1.1) both}
.opt:nth-of-type(2){animation-delay:.06s}.opt:nth-of-type(3){animation-delay:.12s}.opt:nth-of-type(4){animation-delay:.18s}
.opt:hover{transform:translateX(4px)}
.pri{position:relative;overflow:hidden}
.pri::after{content:"";position:absolute;top:0;left:-70%;width:45%;height:100%;background:linear-gradient(100deg,transparent,#ffffff70,transparent);transform:skewX(-20deg);animation:sheen 5s ease-in-out 1.2s infinite;pointer-events:none}
.pri:disabled::after{display:none}
@keyframes sheen{0%,70%{left:-70%}100%{left:130%}}
button:hover:not(:disabled){transform:translateY(-1px)}
button:active:not(:disabled){transform:translateY(3px) scale(.98)}
.chip{animation:pop .45s cubic-bezier(.3,1.6,.5,1) both}
.chip.turn{animation:pop .45s cubic-bezier(.3,1.6,.5,1) both,turn 2.4s ease-in-out .5s infinite}
@keyframes turn{50%{transform:translateY(-3px);box-shadow:0 5px 0 var(--edge2),0 0 0 4px #ff8a3d33}}
.chip .dot{transition:transform .3s}

@keyframes breath{50%{box-shadow:0 0 0 2px #fff,0 0 0 5px #ffffff00,0 0 8px currentColor}}
.rhead .badge,.modal .badge{animation:badgein .5s cubic-bezier(.3,1.5,.5,1) both,float 4.5s ease-in-out .5s infinite}
@keyframes float{50%{transform:translateY(-3px) rotate(3deg)}}
.hint>div{animation:hintin .4s cubic-bezier(.2,.9,.3,1.2)}
.hint.same>div{animation:none}
@keyframes hintin{from{transform:translateY(18px);opacity:.3}}
.wave-t span{display:inline-block;animation:letter .7s cubic-bezier(.3,1.6,.5,1) both}
@keyframes letter{from{transform:translateY(-22px) rotate(-8deg);opacity:0}}
.bigcode span{display:inline-block;animation:letter .6s cubic-bezier(.3,1.6,.5,1) both}
.banner .serif{animation:titlepop .6s cubic-bezier(.3,1.6,.5,1) both}
@keyframes titlepop{from{transform:scale(.7);opacity:0}}
.verdict{animation:titlepop .5s cubic-bezier(.3,1.8,.5,1) both;animation-delay:inherit}
.guess.ok{animation:okglow 1.4s ease-out 1s}
@keyframes okglow{0%{box-shadow:0 0 0 0 #1fb48866}100%{box-shadow:0 0 0 14px #1fb48800}}
input:focus,textarea:focus{transition:box-shadow .25s,border-color .25s}
#toast.on{animation:toastb .5s cubic-bezier(.3,1.7,.5,1)}
@keyframes toastb{from{transform:translateX(-50%) translateY(-90px)}}
.tabs button{transition:transform .2s,background .2s}
/* carte vivante */
.amb{pointer-events:none}
.amb .tw{transform-box:fill-box;transform-origin:center;animation:twinkle 3.2s ease-in-out infinite}
@keyframes twinkle{0%,100%{opacity:0;transform:scale(.4) rotate(0)}50%{opacity:.95;transform:scale(1) rotate(45deg)}}
.amb .gull{animation:gull linear infinite}
@keyframes gull{from{transform:translateX(-80px)}to{transform:translateX(1120px)}}
.amb .flap{transform-box:fill-box;transform-origin:center;animation:flap .9s ease-in-out infinite}
@keyframes flap{50%{transform:scaleY(.55)}}
.amb .sun{transform-box:fill-box;transform-origin:center;animation:sunp 4s ease-in-out infinite}
@keyframes sunp{50%{transform:scale(1.15);opacity:.55}}
.amb .smoke{transform-box:fill-box;transform-origin:center;animation:smk 4.5s ease-out infinite}
@keyframes smk{0%{transform:translate(0,0) scale(.4);opacity:0}20%{opacity:.75}100%{transform:translate(18px,-120px) scale(1.6);opacity:0}}
.amb .rip{transform-box:fill-box;transform-origin:center;animation:rip 3.6s ease-out infinite}
@keyframes rip{0%{transform:scale(.3);opacity:.8}100%{transform:scale(1.6);opacity:0}}
.amb .lan{transform-box:fill-box;transform-origin:center;animation:lan 1.8s ease-in-out infinite}
@keyframes lan{0%,100%{opacity:.35;transform:scale(1)}30%{opacity:.6;transform:scale(1.15)}60%{opacity:.4}75%{opacity:.65}}
.amb .fly{animation:fly 6s ease-in-out infinite}
@keyframes fly{25%{transform:translate(22px,-14px)}50%{transform:translate(40px,4px)}75%{transform:translate(14px,12px)}}
.amb .leaf{transform-box:fill-box;transform-origin:bottom center;animation:leaf 3.5s ease-in-out infinite}
@keyframes leaf{50%{transform:rotate(4deg)}}
.reg.open .hot{animation:da 1.6s linear infinite,hotglow 2.4s ease-in-out infinite}
@keyframes hotglow{50%{filter:drop-shadow(0 0 12px #ffcf7a)}}
.lbl{transform-box:fill-box;transform-origin:center}
.lbl.can{animation:lblb 2.6s ease-in-out infinite}
@keyframes lblb{50%{transform:translateY(-4px)}}
.burst{transform-box:fill-box;transform-origin:center;animation:burst 1.4s ease-out forwards}
@keyframes burst{0%{transform:scale(.2);opacity:1}100%{transform:scale(1.8);opacity:0}}
@keyframes pinb{50%{transform:translateY(-3px)}}
/* confettis */
.cf{position:absolute;top:-14px;width:9px;height:14px;border-radius:2px;animation:cf linear forwards}
@keyframes cf{to{transform:translate(var(--dx),110vh) rotate(var(--r));opacity:.9}}
.spark{position:absolute;width:10px;height:10px;border-radius:50%;animation:spark .9s ease-out forwards}
@keyframes spark{from{transform:translate(0,0) scale(1);opacity:1}to{transform:translate(var(--dx),var(--dy)) scale(.2);opacity:0}}
/* nuancier */
.sw{display:flex;gap:12px;flex-wrap:wrap;padding:4px 2px}
.sw button{width:42px;height:42px;border-radius:50%;padding:0;border:3px solid #fff;background:radial-gradient(circle at 32% 26%,#ffffffb0 0 9%,transparent 30%),linear-gradient(145deg,var(--c2),var(--c));box-shadow:0 3px 0 var(--edge2),inset 0 -5px 9px #0000001f;position:relative;transition:transform .3s cubic-bezier(.3,1.6,.5,1),box-shadow .3s}
.sw button:hover{transform:translateY(-3px) scale(1.06);background:radial-gradient(circle at 32% 26%,#ffffffb0 0 9%,transparent 30%),linear-gradient(145deg,var(--c2),var(--c))}
.sw button.on{transform:scale(1.16);box-shadow:0 0 0 3px var(--c),0 8px 16px color-mix(in srgb,var(--c) 45%,transparent)}
.sw button svg{position:absolute;inset:0;margin:auto;width:20px;height:20px;opacity:0;transform:scale(.2) rotate(-30deg);transition:.35s cubic-bezier(.3,1.6,.5,1);filter:drop-shadow(0 1px 1px #0004)}
.sw button.on svg{opacity:1;transform:none}
.me-prev{margin-top:14px;display:flex;align-items:center;gap:10px;color:var(--mut);font-size:14px;font-weight:700}
/* matières en dégradé */
.card{background:linear-gradient(180deg,#fffdf7,#fff5e2)}
.card.flat{background:linear-gradient(180deg,#fdf5e4,#f8ecd2)}
button{background:linear-gradient(180deg,#ffffff,#fff6e6)}
.chip{background:linear-gradient(180deg,#fffdf7,#fff1db)}
.top,.hero{background:radial-gradient(120% 140% at 15% 0%,#2aa3b3 0%,#127083 38%,#0b4d5b 100%)}
.hint>div{background:linear-gradient(180deg,#fffdf7,#fff3de)}
.big-ans,.val,.bigcode{background:linear-gradient(180deg,#ffa54d,#e2601e);-webkit-background-clip:text;background-clip:text;color:transparent}
.dot{box-shadow:0 0 0 2px #fff,inset 0 -2px 3px #0002}

.ch-pop{border-top:2px dashed var(--edge);padding:10px;max-height:200px;overflow-y:auto;animation:chin .22s ease both}
.ch-pop[hidden]{display:none}
.ch-emo{display:grid;grid-template-columns:repeat(auto-fill,minmax(36px,1fr));gap:2px}
.ch-emo button{padding:0;height:38px;font-size:22px;border:none;background:none;box-shadow:none;border-radius:10px;transition:transform .15s,background .15s}
.ch-emo button:hover{background:var(--paper2);transform:scale(1.18)}
.ch-gq{padding:9px 12px;font-size:14px;border-radius:12px}
.ch-gres{display:grid;grid-template-columns:repeat(3,1fr);gap:6px;margin-top:8px}
.ch-gt{padding:0;height:84px;border-radius:10px;overflow:hidden;box-shadow:none;border:2px solid var(--edge);background:var(--paper2)}
.ch-gt img,.ch-gt video{width:100%;height:100%;object-fit:cover;display:block}
.ch-gt.one{grid-column:1/-1;height:120px;width:auto;justify-self:start;aspect-ratio:auto}
.ch-gt.one img,.ch-gt.one video{width:auto;max-width:100%}
.ch-gt:hover{border-color:var(--acc)}
.ch-note{grid-column:1/-1;color:var(--mut);font-size:13px;margin:2px 2px 0;line-height:1.4}
.ch-bar{display:flex;align-items:center;gap:6px;padding:10px;border-top:2px solid var(--edge);background:var(--paper2)}
.ch-in{flex:1;min-width:0;padding:10px 12px;font-size:15px;border-radius:14px}
.ch-b{flex:none;width:38px;height:38px;padding:0;border-radius:12px;box-shadow:none;font-size:19px;display:grid;place-items:center}
.ch-bg{font:700 11px Nunito,sans-serif;letter-spacing:.04em;color:var(--deep)}
.ch-b.on{border-color:var(--acc);background:#fff4e8}
.ch-send{flex:none;width:42px;height:42px;padding:0;border-radius:50%;display:grid;place-items:center;background:linear-gradient(180deg,var(--acc2),var(--acc));border-color:var(--acc-d);color:#fff;box-shadow:0 3px 0 var(--acc-d)}
.ch-send svg{width:20px;height:20px;margin-inline-start:-2px}
[dir=rtl] .ch-send svg{transform:scaleX(-1)}
.ch-badge{position:absolute;top:-5px;inset-inline-end:-5px;min-width:19px;height:19px;padding:0 5px;border-radius:99px;background:var(--acc);color:#fff;font:800 11px/19px Nunito,sans-serif;font-style:normal;text-align:center;border:2px solid #fff;transform:scale(0);transition:transform .25s cubic-bezier(.3,1.6,.5,1)}
.ch-badge.on{transform:scale(1)}
.ch-hb{position:relative;flex:none;width:44px;height:44px;padding:0!important;border-radius:50%;display:grid;place-items:center;font-size:20px!important;box-shadow:0 3px 0 var(--edge2)}
.ch-peek{position:fixed;z-index:23;max-width:260px;background:var(--paper);border:2px solid var(--edge);border-radius:16px;padding:8px 12px;font-size:13px;box-shadow:0 4px 0 var(--edge2),0 10px 24px #0e586633;display:flex;gap:6px;cursor:pointer;opacity:0;transform:translateY(8px) scale(.95);pointer-events:none;transition:opacity .25s,transform .3s cubic-bezier(.3,1.5,.5,1)}
.ch-peek span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;min-width:0}
.ch-peek b{flex:none}
.ch-peek.on{opacity:1;transform:none;pointer-events:auto}
.ch-veil{display:none}
@keyframes chin{from{opacity:0;transform:translateY(6px)}}
@media (min-width:1100px){
 .ch-box{top:0;bottom:0;right:0;width:var(--chw);border-width:0 0 0 2px;transform:translateX(100%)}
 .chat.open .ch-box{transform:none}
 .ch-tab{position:fixed;z-index:24;right:0;top:50%;width:46px;height:58px;padding:0;margin-top:-29px;border-radius:16px 0 0 16px;border-right:none;font-size:22px;display:grid;place-items:center;box-shadow:-3px 4px 0 var(--edge2);transition:right .38s cubic-bezier(.2,.9,.3,1.05),background .2s}
 .chat.open .ch-tab{right:var(--chw)}
 .ch-peek{right:58px;top:50%;margin-top:-20px;transform:translateX(8px) scale(.95)}
 .ch-hb{display:none!important}
 #app,.hint{transition:margin .38s,right .38s}
 body.ch-open #app{margin-left:max(0px,calc((100vw - var(--chw,320px) - 700px)/2))}
 body.ch-open .hint{right:320px}
}
@media (max-width:1099.98px){
 .ch-tab{display:none}
 .ch-box{left:0;right:0;bottom:0;height:70vh;height:70dvh;border-radius:24px 24px 0 0;border-bottom:none;transform:translateY(105%);padding-bottom:env(safe-area-inset-bottom)}
 .chat.open .ch-box{transform:none}
 .chat.open .ch-veil{display:block;position:fixed;inset:0;z-index:23;background:#0e586633;animation:chin .25s ease both}
 .ch-peek{right:16px;bottom:calc(92px + env(safe-area-inset-bottom))}
 .ch-in{font-size:16px}
}




/* @css-game */
.gauge{display:flex;align-items:center;gap:8px;height:14px;margin:5px 4px 0;opacity:.55;transition:opacity .3s}
.gauge.on{opacity:1}
.gauge i{flex:1;height:5px;border-radius:9px;background:#e9dcc4;overflow:hidden;display:block}
.gauge b{display:block;height:100%;width:calc(var(--p,0)*100%);border-radius:9px;background:linear-gradient(90deg,#5cc8b4,#2a9d8f);transition:width .15s,background .3s}
.gauge.mid b{background:linear-gradient(90deg,#f6b26b,#f28c38)}
.gauge.full b{background:#e2603e}
.gauge span{font:800 11px Nunito,sans-serif;color:var(--acc-d);font-variant-numeric:tabular-nums}
.gauge.full span{color:#c94a2a}
.gtiles{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:12px}
.gtile{display:flex;flex-direction:column;align-items:flex-start;gap:2px;text-align:start;padding:12px 14px;border-radius:18px;background:#fff;border:2px solid var(--edge);box-shadow:0 4px 0 var(--edge2);font:600 15px Nunito,sans-serif;color:var(--txt)}
div.gtile{grid-column:1/-1}
.gtile .gi{font-size:26px;line-height:1.1}
.gtile .gt{display:flex;flex-direction:column}.gtile .gt b{font:600 17px Fredoka,Nunito,sans-serif}.gtile .gt .mut{font-size:13px;line-height:1.3}
.gtile .gmin{margin-top:4px;font:700 12px Nunito;color:var(--deep);background:#e3f6f4;border-radius:99px;padding:2px 9px}
.gtile.sel .gmin{background:#ffe2c6;color:var(--acc-d)}
.gby{margin-top:10px;font-size:13px;color:var(--mut)}
.gmets{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-top:12px}
.gmet[data-vote]{display:flex;flex-direction:column;align-items:stretch;justify-content:flex-start;gap:6px;text-align:start;padding:12px;font:600 14px Nunito,sans-serif}
.gmh{display:flex;align-items:center;justify-content:space-between;gap:6px}.gmh b{font:600 17px Fredoka,Nunito,sans-serif}
.wbars{display:inline-flex;gap:2px;align-items:flex-end}.wbars i{width:5px;border-radius:2px;background:var(--edge)}.wbars i:nth-child(1){height:7px}.wbars i:nth-child(2){height:11px}.wbars i:nth-child(3){height:15px}.wbars i.on{background:#3aa7b5}
[data-theme=dark] .wbars i{background:#ffffff1f}[data-theme=dark] .wbars i.on{background:#5fd4e0;box-shadow:0 0 6px #5fd4e055}
.gline{font-size:13px;line-height:1.3;color:var(--mut);font-weight:700;min-height:34px}
.gbad{display:flex;flex-wrap:wrap;gap:2px}.gbad>span{display:inline-flex;transition:opacity .2s}.gbad>span.off{opacity:.22;filter:grayscale(1)}
.gbad .badge,.gbad svg{width:22px;height:22px;box-shadow:none;animation:none}
.gseg{display:flex;gap:6px;margin-top:10px;flex-wrap:wrap}.gseg>button{flex:1;padding:9px 8px;font-size:15px;min-width:64px}
.gsub{margin-top:8px;font-size:13px;color:var(--mut);font-weight:700}
.gval{margin-top:8px;font:600 16px Fredoka,Nunito,sans-serif}
h3.gh{margin-top:18px;font-size:17px}
.gsw{display:flex;align-items:center;gap:12px;width:100%;margin-top:10px;text-align:start;font:600 14px Nunito,sans-serif;padding:10px 14px}
.gsw i{flex:none;width:44px;height:26px;border-radius:99px;background:var(--edge);position:relative;transition:background .25s}
.gsw i::after{content:"";position:absolute;top:3px;inset-inline-start:3px;width:20px;height:20px;border-radius:50%;background:#fff;box-shadow:0 1px 3px #0003;transition:inset-inline-start .25s cubic-bezier(.3,1.4,.5,1)}
.gsw.on{border-color:var(--acc);background:#fff4e8}.gsw.on i{background:var(--acc)}.gsw.on i::after{inset-inline-start:21px}
.grecap{text-align:center;margin:16px 0 10px;font:700 14px Nunito;color:var(--deep)}
.gnote{margin-top:10px;font-size:13px;font-weight:700;color:var(--deep)}
.gkw{margin-top:14px}
.gcount{border-style:dashed}
.dot.ganon{background:repeating-linear-gradient(45deg,#d8bd88 0 3px,#ead6ae 3px 6px)}
/* barre de progression */
#gprog{display:flex;align-items:center;gap:12px;margin:-4px 4px 10px;padding:5px 12px 5px 16px;border-radius:99px;background:#fffaf0cc;font:700 12px Nunito;color:var(--deep)}
#gprog .wake{flex:1;position:relative;height:6px;border-radius:99px;background:#d9eeee}
#gprog .wake i{position:absolute;inset-block:0;inset-inline-start:0;border-radius:99px;background:linear-gradient(90deg,#7deac6,#13a983);transition:width .8s var(--e,ease)}
#gprog .boat{position:absolute;top:50%;transform:translate(-50%,-58%);font-size:17px;transition:inset-inline-start .8s var(--e,ease);text-shadow:none}
[dir=rtl] #gprog .boat{transform:translate(50%,-58%) scaleX(-1)}
#gprog b{white-space:nowrap}
#gprog.last .wake i{background:linear-gradient(90deg,var(--acc2),var(--acc))}
#gprog.last b{color:var(--acc-d)}
/* sablier */
.tmr{display:inline-flex;align-items:center;gap:4px;flex:none}
.tring{position:relative;width:42px;height:42px;padding:0;border-radius:50%;display:grid;place-items:center;background:#fff;box-shadow:none;border:none}
.tring:active{transform:scale(.94);box-shadow:none}
.tring svg{position:absolute;inset:0;transform:rotate(-90deg)}
.tring circle{fill:none;stroke-width:4}.tring .tbk{stroke:var(--edge)}.tring .tfg{stroke:#13a983;stroke-linecap:round;transition:stroke-dasharray .25s linear,stroke .3s}
.tring b{position:relative;font:700 13px Nunito;color:var(--txt)}
.tmr.low .tfg{stroke:var(--acc)}.tmr.low b{color:var(--acc-d)}
.tmr.calm .tring{opacity:.45;transform:scale(.8)}.tmr.calm b{visibility:hidden}.tmr .tring{transition:opacity .4s,transform .4s}
.tmr.soft .tfg{stroke:#a9b8d6}.tmr.pz .tfg{stroke:var(--edge2)}
.tplus{padding:4px 8px!important;font:700 12px Nunito!important;border-radius:99px;box-shadow:0 2px 0 var(--edge2)}
/* fiches du bilan */
.gfacts{list-style:none;margin:8px 0 0;padding:0}
.gfacts li{display:flex;gap:10px;align-items:flex-start;padding:8px 0;border-bottom:1px dashed var(--edge)}
.gfacts li:last-child{border-bottom:none}
.gfacts li>div{flex:1;min-width:0;overflow-wrap:anywhere;font-weight:600}
.gfacts .badge,.gfacts svg{flex:none;width:26px;height:26px;animation:none}
.g3 li{background:#fff7ea;border:none;border-radius:14px;padding:10px 12px;margin-bottom:6px}
.grc h3.gh:first-child{margin-top:0}
.grm{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:14px}
.grm button{display:flex;flex-direction:column;gap:2px;align-items:center;text-align:center}
.grm button span{font:600 12px Nunito;opacity:.85}
.grev{max-width:560px!important;text-align:start!important;max-height:86vh;overflow:auto}
@media (max-width:480px){
 .gmets{grid-template-columns:1fr}
 .gline{min-height:0}
 .gtile{padding:10px 12px}.gtile .gi{font-size:22px}
 .grm{grid-template-columns:1fr}
 .tring{width:38px;height:38px}
}




/* @css-theme */
/* @css-art2 */
/* --- fond marin cartoon doux : formes SVG rondes, aplats pastel, tout animé en transform/opacity (compositeur) ---
   Pas de canvas ni de requestAnimationFrame : le décor continue de vivre pendant le défilement tactile. */
:root{--w0:#c9f5ec;--w1:#9fe3da;--w2:#6fcbcf;--w3:#4fb0bd;--orb:#fff7dc;--orb2:#fff1c2;--ray:#fffbe6;--rayo:.42;--sf:#e9fff9;--sfo:.55;
 --d1:#9ed9cf;--d2:#f3dcb8;--d3:#f8e9cc;--dh:#fff7e6;--pb:#e6c9a2;--pb2:#d9b48c;--sh:#ffb9a6;--sh2:#ff9f8a;
 --c1:#ff9f8f;--c1b:#ffc2b4;--c2:#ffc59e;--c2b:#ffe0c6;--c3:#bba8ec;--c3b:#d9ccff;--c4:#ffd98c;--c4b:#fff0c4;--stf:#ff9a7a;
 --g1:#67c99b;--g2:#93debb;--f1:#ffa877;--f2:#ffd36b;--fe:#ffffff;--fp:#3a4a5a;--jl:#ffc9de;--jl2:#ffe6f0;--gl:#fffbe0;--glo:.35;--mgo:0}
[data-theme=dark]{--w0:#33467f;--w1:#27356b;--w2:#1e2858;--w3:#171d44;--orb:#f4efd2;--orb2:#c9d4ff;--ray:#b8c6ff;--rayo:.2;--sf:#5a6fb0;--sfo:.45;
 --d1:#2c3a72;--d2:#39437f;--d3:#434c8c;--dh:#5a63a6;--pb:#545c9a;--pb2:#474e8a;--sh:#8b78c6;--sh2:#7563b5;
 --c1:#7b63b8;--c1b:#9a86d6;--c2:#5d6fbf;--c2b:#8191dd;--c3:#8a5fae;--c3b:#b083cf;--c4:#4f80b8;--c4b:#77a6d6;--stf:#a46cb0;
 --g1:#2f7a8c;--g2:#43979f;--f1:#6f8fe0;--f2:#9a7fe0;--fe:#e8f0ff;--fp:#1a2050;--jl:#c7b6ff;--jl2:#efe6ff;--gl:#8ff4ff;--glo:1;--mgo:1}
html,body{overscroll-behavior-y:none}
body{background:var(--w2)}
body::before{display:none}
#sky{inset:0 0 auto 0;height:100vh;height:100lvh;contain:strict;background:radial-gradient(70% 40% at 80% 0%,var(--orb2),transparent 70%),linear-gradient(180deg,var(--w0) 0%,var(--w1) 35%,var(--w2) 70%,var(--w3) 100%)}
#sky .glow{display:none}
#sky>i{background:radial-gradient(circle at 34% 30%,#fff 0 16%,#ffffff33 30%,#ffffff1f 62%,#ffffffa6 70%,transparent 75%)}
#sky span{position:absolute;display:block;pointer-events:none}
#sky svg{display:block;width:100%;height:100%;overflow:visible}
#sky .orb{right:8%;top:-9vmin;width:30vmin;height:30vmin;border-radius:50%;background:radial-gradient(circle,var(--orb) 0 30%,#fff7dc77 46%,transparent 70%);animation:sk-orb 9s ease-in-out infinite alternate}
[data-theme=dark] #sky .orb{width:22vmin;height:22vmin;top:-5vmin;background:radial-gradient(circle,var(--orb) 0 34%,#e9edff55 38%,#c9d4ff22 56%,transparent 72%)}
#sky .rays{inset:0 0 15% 0;opacity:var(--rayo);-webkit-mask:linear-gradient(#000,#0006 55%,transparent);mask:linear-gradient(#000,#0006 55%,transparent)}
#sky .rays span{top:-12%;left:var(--x);width:var(--w);height:120%;border-radius:999px;transform-origin:50% 0;background:linear-gradient(90deg,transparent,var(--ray) 35% 65%,transparent);transform:rotate(var(--a));animation:sk-ray var(--d) ease-in-out infinite alternate}
#sky .surf{left:0;top:0;width:200%;height:7%;opacity:var(--sfo);animation:sk-surf 34s linear infinite}
#sky .mg{width:var(--w);height:5px;border-radius:9px;background:var(--orb);opacity:0;animation:sk-mg 3.4s ease-in-out infinite alternate}
#sky .dn{left:0;right:0;bottom:0;height:30%}
#sky .cl{bottom:0;width:min(40vw,440px);aspect-ratio:400/260}
#sky .cl.l{left:-1vw}#sky .cl.r{right:-1vw}
#sky .alg{bottom:0;width:var(--w);height:var(--h);transform-origin:50% 100%;animation:sk-alg var(--d) ease-in-out infinite alternate}
#sky .fish{left:0;width:var(--s);aspect-ratio:60/36;animation:sk-fish var(--d) linear infinite}
#sky .fish.rv{animation-name:sk-fishr}
#sky .fish>span,#sky .jel>span{inset:0;animation:sk-bob 3.2s ease-in-out infinite alternate}
#sky .fish.rv>span>svg{transform:scaleX(-1)}
#sky .jel{width:var(--s);aspect-ratio:50/72;animation:sk-jel 9s ease-in-out infinite alternate}
#sky .jel>span{animation:sk-pulse 2.6s ease-in-out infinite alternate;transform-origin:50% 30%}
[data-theme=dark] #sky .jel,[data-theme=dark] #sky .fish{filter:drop-shadow(0 0 6px #b9a8ff88)}
#sky .glw{width:var(--s);height:var(--s);border-radius:50%;background:radial-gradient(circle,var(--gl) 0 22%,#8ff4ff44 40%,transparent 70%);opacity:0;animation:sk-glw var(--d) ease-in-out infinite alternate}
@keyframes sk-orb{to{transform:scale(1.06);opacity:.85}}
@keyframes sk-ray{0%{transform:rotate(var(--a)) scaleX(.85);opacity:.55}100%{transform:rotate(calc(var(--a) + 3deg)) scaleX(1.15);opacity:1}}
@keyframes sk-surf{to{transform:translateX(-50%)}}
@keyframes sk-mg{0%{opacity:calc(var(--mgo)*.15);transform:scaleX(.7)}100%{opacity:calc(var(--mgo)*.8);transform:scaleX(1.1)}}
@keyframes sk-alg{0%{transform:rotate(calc(var(--k,4deg)*-1)) skewX(var(--k,4deg))}100%{transform:rotate(var(--k,4deg)) skewX(calc(var(--k,4deg)*-1))}}
@keyframes sk-fish{0%{transform:translateX(-20vw)}100%{transform:translateX(120vw)}}
@keyframes sk-fishr{0%{transform:translateX(120vw)}100%{transform:translateX(-20vw)}}
@keyframes sk-bob{0%{transform:translateY(-5px) rotate(-2deg)}100%{transform:translateY(5px) rotate(2deg)}}
@keyframes sk-jel{0%{transform:translateY(0)}100%{transform:translateY(-6vh)}}
@keyframes sk-pulse{0%{transform:scale(1.05,.94)}100%{transform:scale(.96,1.05)}}
@keyframes sk-glw{0%{opacity:calc(var(--glo)*.15);transform:scale(.8)}100%{opacity:var(--glo);transform:scale(1.1)}}
@media (max-width:600px){#sky .cl{width:58vw}#sky .cl.l{left:-14vw}#sky .cl.r{right:-14vw}#sky .dn{height:24%}}
/* mouvement réduit : le fond ralentit et bouge à peine (au lieu d'être figé net par la règle globale) */
@media (prefers-reduced-motion:reduce){
 #sky>i,#sky .fish{display:none}
 #sky .alg{--k:1.5deg;animation:sk-alg 14s ease-in-out infinite alternate!important}
 #sky .rays span{animation:sk-ray 20s ease-in-out infinite alternate!important}
 #sky .glw{animation:sk-glw 9s ease-in-out infinite alternate!important}
 #sky .mg{animation:sk-mg 8s ease-in-out infinite alternate!important}
 #sky .jel{animation:sk-jel 24s ease-in-out infinite alternate!important}
}
/* --- eau WebGL + profondeur (flou par plans) --- */
#sky canvas.wgl{position:absolute;left:0;top:0;width:100%;height:100%;display:block}
#sky.gl .orb,#sky.gl .rays,#sky.gl .surf,#sky.gl .mg{display:none}
#sky.gl .dn{opacity:.55}
#sky .cl.f{bottom:15vh;width:min(20vw,230px);filter:blur(2.6px) saturate(.7);opacity:.55}
#sky .cl.f svg>path:first-child,#sky .cl.m svg>path:first-child{display:none}
#sky .cl.f.l{left:20vw}#sky .cl.f.r{right:18vw}
#sky .cl.m{bottom:6vh;width:min(28vw,320px);filter:blur(1.1px) saturate(.85);opacity:.82}
#sky .cl.m.l{left:9vw}#sky .cl.m.r{right:8vw}
#sky .haze{left:0;right:0;bottom:0;pointer-events:none}
#sky .haze.f{height:34vh;background:linear-gradient(transparent,color-mix(in srgb,var(--w2) 45%,transparent) 55%,transparent)}
#sky .haze.m{height:18vh;background:linear-gradient(transparent,color-mix(in srgb,var(--w2) 25%,transparent))}
@media (max-width:600px){#sky .cl.f{width:34vw;bottom:13vh}#sky .cl.f.l{left:8vw}#sky .cl.f.r{right:6vw}#sky .cl.m{width:44vw;bottom:5vh}#sky .cl.m.l{left:-6vw}#sky .cl.m.r{right:-6vw}}
/* ombres qui passent sur le fond */
#sky .shd{left:0;bottom:1vh;width:min(62vw,720px);aspect-ratio:300/110;opacity:var(--shdo,.38);filter:blur(6px);transform-origin:50% 100%;will-change:transform}
#sky .shd>span{inset:0;transform:scaleY(.55) skewX(-14deg);transform-origin:50% 100%}
#sky .shd svg{fill:var(--shdc,#0b3b4a)}
#sky .shd.m{bottom:7vh;width:min(20vw,220px);aspect-ratio:112/204}
#sky .shd.m>span{animation:sk-flap 6s ease-in-out infinite alternate}
[data-theme=dark] #sky{--shdo:.55;--shdc:#02071a}
@keyframes sk-flap{0%{transform:scaleY(.34) skewX(-10deg)}100%{transform:scaleY(.26) skewX(-16deg)}}
/* --- logo vectoriel --- */
.logo .lgn{display:none}
[data-theme=dark] .logo .lgn{display:inline}[data-theme=dark] .logo .lgd{display:none}
.brand .logo{flex:none;filter:drop-shadow(0 2px 3px #0004)}
.hero .logo{display:block;margin:0 auto;filter:drop-shadow(0 5px 0 #0a4652) drop-shadow(0 12px 18px #0006);animation:bob 4s ease-in-out infinite}
/* --- bouton jour / nuit --- */
.thm{position:relative;overflow:hidden;color:#ffe2a6}
.thm svg{position:absolute;inset:0;margin:auto;width:19px;height:19px;transition:transform .55s cubic-bezier(.3,1.5,.5,1),opacity .3s}
.thm .i-sun{opacity:0;transform:rotate(-90deg) scale(.3)}

[data-theme=dark] .thm .i-sun{opacity:1;transform:none}

/* ===== mode nuit sous l'eau ===== */

:where([data-theme=dark]) button:hover{background:linear-gradient(180deg,#20405c,#18324b)}

[data-theme=dark] .modal{background:#020b17b8}

[data-theme=dark] .banner .serif{text-shadow:0 2px 0 #0007}

[data-theme=dark] .langbar select,[data-theme=dark] .dd-b,[data-theme=dark] .langbar .thm{background:linear-gradient(180deg,#1a344d,#142b41)}

[data-theme=dark] input[type=checkbox]{background:linear-gradient(180deg,#10253a,#0b1c2d)}

[data-theme=dark] .ch-bub{background:#0f2538}
[data-theme=dark] .ch-bub.emo{background:none}
[data-theme=dark] .ch-m.me .ch-bub{background:#3a2a20;border-color:#6e4629}
[data-theme=dark] .ch-badge{border-color:var(--paper)}
[data-theme=dark] .chat.open .ch-veil{background:#020b1780}
[data-theme=dark] .gauge i{background:#203c55}

[data-theme=dark] .gtile .gmin{background:#12403f;color:#8fd6dc}
[data-theme=dark] .gtile.sel .gmin{background:#4a2b18;color:#ffb37f}
[data-theme=dark] .gsw i::after{background:#ece3cf}
[data-theme=dark] .dot.ganon{background:repeating-linear-gradient(45deg,#4a6378 0 3px,#2a4157 3px 6px)}
[data-theme=dark] #gprog{background:#0f2335cc}
[data-theme=dark] #gprog .wake{background:#1d3a52}
[data-theme=dark] .g3 li{background:#182f45}

/* @css-fun */
#fx{position:fixed;inset:0;z-index:22;pointer-events:none;overflow:hidden;contain:layout paint}
.fxp{position:fixed;left:0;top:0;opacity:0;pointer-events:none;line-height:1;user-select:none;-webkit-user-select:none;will-change:transform,opacity}
.fxring{width:70px;height:70px;border-radius:50%;background:radial-gradient(circle,transparent 56%,#ffd26ab3 62%,transparent 70%)}
.fxglow{width:140px;height:140px;border-radius:50%;background:radial-gradient(circle,#ffbecdd9,#ffe2a066 45%,transparent 70%)}
.fxtint{width:100vw;height:100vh;left:0;top:0;transform:none!important}
.fxtint.warm{background:radial-gradient(ellipse at 50% 108%,#ff781e73,#ffa03c1f 50%,transparent 75%)}
.fxtint.blue{background:linear-gradient(#4682c847,transparent 60%)}
.fxtint.gold{background:radial-gradient(circle at 50% 45%,#ffd75a66,transparent 65%)}
.fxgold{filter:drop-shadow(0 0 10px #ffd34d) drop-shadow(0 0 20px #ffb300)}
#fxt{position:fixed;left:50%;top:22%;transform:translateX(-50%);opacity:0;z-index:23;pointer-events:none;padding:8px 18px;border-radius:99px;font:800 20px Nunito,Rubik,sans-serif;color:var(--txt);background:linear-gradient(180deg,#fffdf7,#fff1db);border:2px solid #ff9d6b;box-shadow:0 3px 0 #0e58661f,0 10px 24px #0e586638;white-space:nowrap;max-width:92vw;overflow:hidden;text-overflow:ellipsis}
#fxt.gold{border-color:#e8b830;color:#7a5200;box-shadow:0 0 18px #ffd34d99,0 10px 24px #0e586638}
.rxp .em{display:inline-block}
.rxp[data-lv="1"] .em{scale:1.25;margin:0 2px}
.rxp[data-lv="2"] .em{scale:1.5;margin:0 4px}
.rxp[data-lv="3"] .em{scale:1.75;margin:0 6px}
.rxp[data-lv="4"] .em{scale:2;margin:0 8px}
.rxp.gold{border-color:#e8b830;box-shadow:0 0 14px #ffd34dbb,0 8px 18px #0e586630}
.reacts button{touch-action:manipulation;user-select:none;-webkit-user-select:none;-webkit-touch-callout:none;transition:transform .45s ease-out,box-shadow .2s}
.reacts button.chg{transform:scale(1.45)}
.reacts button.rdy{box-shadow:0 0 0 3px #ffd34d,0 0 16px #ffb300aa}
@media (max-width:560px){#fxt{font-size:17px;top:18%}}
@media (prefers-reduced-motion:reduce){.rxp .em{scale:none!important;margin:0!important}.reacts button.chg{transform:none}}




/* @css-game2 */
/* demandes d'arrivée (hôte) */
#g2req{position:fixed;top:12px;left:50%;transform:translateX(-50%);z-index:60;display:flex;flex-direction:column;gap:8px;width:min(420px,calc(100vw - 32px))}
.g2rq{display:flex;align-items:center;gap:8px;padding:10px 12px;border-radius:18px;background:#fffaf0;border:2px solid var(--edge);box-shadow:0 4px 0 var(--edge2),0 12px 28px #0e586633;animation:g2in .35s cubic-bezier(.3,1.5,.5,1)}
.g2rq .g2rt{flex:1;min-width:0;font:600 14px Nunito,sans-serif;overflow-wrap:anywhere}
.g2rq button{flex:none;padding:7px 12px;font-size:14px}
@keyframes g2in{from{opacity:0;transform:translateY(-14px) scale(.96)}}
/* menu exclure / bannir */
.g2km{position:fixed;z-index:61;display:flex;flex-direction:column;gap:6px;padding:8px;border-radius:16px;background:#fffaf0;border:2px solid var(--edge);box-shadow:0 12px 28px #0e586640;animation:g2in .2s}
.g2km button{display:flex;flex-direction:column;align-items:flex-start;gap:1px;text-align:start;padding:8px 12px;font:600 14px Nunito,sans-serif;box-shadow:none}
.g2km button span{font-size:12px;color:var(--mut);font-weight:700}
.g2km button[data-k="1"]:hover{border-color:#e2603e}
/* cœur « moment fort » */
.g2heart{display:inline-flex;align-items:center;gap:6px;margin:12px auto 0;padding:7px 14px;border-radius:99px;font:700 14px Nunito,sans-serif;background:#fff;box-shadow:0 3px 0 var(--edge2)}
.card .g2heart{display:flex}
.g2heart .g2hi{font-size:18px;line-height:1;transition:transform .3s cubic-bezier(.3,1.8,.5,1)}
.g2heart b{min-width:20px;padding:0 6px;border-radius:99px;background:#ffe2e8;color:#c2335e;font-size:12px}
.g2heart.on{border-color:#ec4f93;background:#fff0f5}.g2heart.on .g2hi{transform:scale(1.15)}
.g2heart.pop .g2hi{animation:g2pop .45s}
@keyframes g2pop{40%{transform:scale(1.6)}}
.g2top{border-color:#f3b6c9}.g2top h3{font-size:17px}.g2top li{align-items:center}
.g2n{flex:none;font:800 13px Nunito;color:#c2335e}
/* souvenirs au-dessus des drapeaux */
.g2mem{display:flex;gap:6px;overflow-x:auto;padding:4px 2px 8px;margin:2px 0 4px;scrollbar-width:thin}
.g2mc{flex:none;display:flex;align-items:center;gap:6px;max-width:220px;padding:5px 10px 5px 6px;border-radius:12px;background:#fff7ea;border:1.5px solid var(--edge);font:700 13px Nunito,sans-serif;color:var(--txt)}
.g2mc span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.g2mc .badge,.g2mc svg{flex:none;width:20px;height:20px;box-shadow:none;animation:none}
.g2lock{margin:6px 2px 4px;font:700 12px Nunito,sans-serif;color:var(--mut)}
/* carte nette sur l'écran de fin et dans le carnet : pas de brume floue, les zones inconnues restent simplement voilées */
.g2end .fog{animation:none!important;opacity:.55}
.g2end .fog g,.g2end .fog path{filter:none!important}
.g2end .fog image{display:none}
/* carnet : légende du fil */
.g2leg{display:flex;flex-wrap:wrap;justify-content:center;gap:4px 14px;margin-top:6px;font:700 12px Nunito,sans-serif;color:var(--mut)}
.g2leg span{display:inline-flex;align-items:center;gap:4px}
/* lobby : ton */
.g2tones .gmet{position:relative;display:flex;flex-direction:column;align-items:stretch;justify-content:flex-start;gap:6px;text-align:start;padding:12px;font:600 14px Nunito,sans-serif}
.g2tones .gline{min-height:0}
.g2_18{font:800 11px Nunito;color:#fff;background:#e2603e;border-radius:99px;padding:1px 7px}
.g2off{opacity:.45}
div.g2tone{display:flex;flex-direction:column;gap:6px;padding:12px;border-radius:18px;border:2px solid var(--edge);background:#fff}
div.g2tone.sel{border-color:var(--acc)}
.g2warn{margin-top:10px;font:700 13px Nunito,sans-serif;color:#c94a2a}
@media (max-width:480px){.g2rq{flex-wrap:wrap}.g2rq .g2rt{flex:1 1 calc(100% - 30px)}.g2rq button{flex:1}}




/* @css-dark */
/* noms en couleur de joueur : les teintes foncées (bleu, violet) passent sous 4.5:1 sur fond nuit, on les éclaircit sans changer la teinte */
[data-theme=dark] :is(b,span)[style*="color"]:not([style*="background"]),[data-theme=dark] .rxp b{filter:brightness(1.32) saturate(.92)}
/* zones verrouillées de la météo : visibles mais éteintes (à .22 elles disparaissaient sur fond nuit) */
[data-theme=dark] .gbad>span.off{opacity:.38;filter:grayscale(1) brightness(1.5)}
/* jauge de caractères : rail crème restait clair */
[data-theme=dark] div.gauge>i:first-child,[data-theme=dark] .gauge i{background:#24425c}
[data-theme=dark] .gauge.full span{color:#ff8f78}
/* boutons radio des choix : le point orange de la sélection était écrasé, et le cercle vide invisible */
[data-theme=dark] .opt::before{border-color:#4d7290}
[data-theme=dark] .opt.sel::before{border-color:var(--acc);box-shadow:inset 0 0 0 5px var(--acc),0 0 0 3px #ff8a3d40}
/* curseur d'échelle : la partie non remplie se confondait avec la carte */
[data-theme=dark] input[type=range]::-webkit-slider-runnable-track{background:linear-gradient(90deg,var(--acc2),var(--acc)) 0/var(--p) 100% no-repeat,#2a4b67;box-shadow:inset 0 0 0 1.5px #3d6482,inset 0 2px 3px #0006}
[data-theme=dark] input[type=range]::-moz-range-track{background:#2a4b67;box-shadow:inset 0 0 0 1.5px #3d6482}
/* interrupteur (anonymat) éteint : rail lisible */
[data-theme=dark] .gsw i{background:#0b1c2d;box-shadow:inset 0 0 0 1.5px #4d7290}
[data-theme=dark] .gsw.on i{background:var(--acc);box-shadow:none}
/* sablier en pause : l'arc restant (var(--edge2), presque noir) disparaissait */
[data-theme=dark] .tmr.pz .tfg{stroke:#8aa3b8}
/* cœur « moment fort » */
[data-theme=dark] .g2heart{background:linear-gradient(180deg,#1a344d,#142b41);color:var(--txt)}
[data-theme=dark] .g2heart b{background:#4a1f33;color:#ff9cc0}
[data-theme=dark] .g2heart.on{background:#3b1d2e;border-color:#ec4f93}
[data-theme=dark] .g2n{color:#ff8fb6}
[data-theme=dark] .g2top{border-color:#7a3b55}
/* souvenirs au-dessus des drapeaux */
[data-theme=dark] .g2mc{background:#182f45;border-color:var(--edge)}
/* mots-souvenirs dans les listes */
[data-theme=dark] .lmkw{color:#ffab6e}
/* demandes d'arrivée et menu exclure / bannir */
[data-theme=dark] .g2rq,[data-theme=dark] .g2km{background:#13293d;box-shadow:0 4px 0 var(--edge2),0 14px 34px #000a}
[data-theme=dark] .g2km button[data-k="1"]:hover{border-color:#ff7d6c}
/* ton des questions (vue des invités), 18+ et avertissement */
[data-theme=dark] div.g2tone{background:#10263a}
[data-theme=dark] .g2_18{background:#c94a2a}
[data-theme=dark] .g2warn{color:#ff9a80}
[data-theme=dark] .g2off{opacity:.55}
/* carnet : noms et chiffres du fil (texte SVG brun foncé sur fond nuit) */
[data-theme=dark] .card>svg text[fill="#3b2a1b"]{fill:var(--txt)}
[data-theme=dark] .card>svg circle[stroke="#fff"]{stroke:#ece3cf}
[data-theme=dark] .g2pill circle{fill:#132a3e}
[data-theme=dark] .g2pill text{fill:var(--txt)}
[data-theme=dark] .card>svg line[stroke="#b9a68a"],[data-theme=dark] .g2leg line[stroke="#b9a68a"]{stroke:#7f95a6}
/* bandeau des effets de réaction */
[data-theme=dark] #fxt{background:linear-gradient(180deg,#1a344d,#142b41);color:var(--txt);box-shadow:0 3px 0 #0006,0 10px 24px #000a}
[data-theme=dark] #fxt.gold{color:#ffd76a;box-shadow:0 0 18px #ffd34d66,0 10px 24px #000a}
/* pastilles de couleur de l'accueil : anneau crème adouci, placeholders et sous-titre de la porte close plus lisibles */
[data-theme=dark] .sw button{border-color:#cfdce4}
[data-theme=dark] ::placeholder{color:#7d96a8}
[data-theme=dark] .dsub{color:#a9e2e6}
/* barres de défilement : rail transparent, pouce arrondi turquoise doux qui s'éclaire au survol */
html[data-theme=dark]{color-scheme:dark}
@supports selector(::-webkit-scrollbar){
 html[data-theme=dark],html[data-theme=dark] :not(.tabs){scrollbar-color:auto;scrollbar-width:auto}
 html[data-theme=dark] ::-webkit-scrollbar{width:10px;height:8px;background:transparent}
 html[data-theme=dark] ::-webkit-scrollbar-track,html[data-theme=dark] ::-webkit-scrollbar-corner{background:transparent}
 html[data-theme=dark] ::-webkit-scrollbar-thumb{background:#3e8f98a6;border-radius:99px;border:2px solid transparent;background-clip:padding-box}
 html[data-theme=dark] ::-webkit-scrollbar-thumb:hover{background:#6fd0d6;background-clip:padding-box}
 html[data-theme=dark] ::-webkit-scrollbar-thumb:active{background:#9be6e8;background-clip:padding-box}
 html[data-theme=dark] .tabs::-webkit-scrollbar{display:none}
}
@supports not selector(::-webkit-scrollbar){
 html[data-theme=dark],html[data-theme=dark] *{scrollbar-color:#3e8f98 transparent}
 html[data-theme=dark] body :hover{scrollbar-color:#6fd0d6 transparent}
}




/* @css-game4 */
.g4bet{display:flex;align-items:center;gap:6px;margin-top:12px;flex-wrap:wrap}.g4bet .mut{font-size:13px;flex:1;min-width:0}
.g4bet button{flex:none;width:44px;height:40px;padding:0;font-size:20px;border-radius:12px;opacity:.55;filter:grayscale(.6)}
.g4bet button.sel{opacity:1;filter:none;outline:2px solid #ff8a3d;outline-offset:1px}
.g4tag{font-size:15px}.g4tag.win{filter:drop-shadow(0 0 6px #ffd76a)}
.g4miss{margin-top:8px;font-size:14px;text-align:center}
.g4f1{font-size:13px;opacity:.75;margin:-4px 0 6px}
.pin.g4gold path[filter]{stroke:#ffc93c;stroke-width:6}
.g4ph{text-align:start}.g4pht{font-weight:800;display:flex;align-items:center;gap:6px;margin-bottom:6px}
.g4pi{display:flex;gap:10px;align-items:center;padding:8px 0;border-top:1px solid color-mix(in srgb,currentColor 12%,transparent);opacity:0;animation:g4in .6s ease-out forwards}
.g4pi b{overflow-wrap:anywhere}.g4pe{font-size:26px;flex:none}
@keyframes g4in{from{opacity:0;transform:translateY(8px) scale(.97)}to{opacity:1;transform:none}}
@media (prefers-reduced-motion:reduce){.g4pi{animation:none;opacity:1}}
/* @css-game3 */
/* fin en étapes */
.g3steps{display:flex;flex-direction:column;align-items:center;gap:6px;margin:4px 0 -6px}
.g3sx{font:800 11px Nunito,sans-serif;letter-spacing:.6px;text-transform:uppercase;color:var(--deep);background:#fffaf0cc;padding:2px 10px;border-radius:99px}
.g3sl{display:flex;align-items:center;gap:6px;flex-wrap:wrap;justify-content:center}
.g3sl span{font:700 13px Nunito,sans-serif;padding:4px 11px;border-radius:99px;background:#fffaf0aa;color:var(--mut);border:2px solid transparent;white-space:nowrap}
.g3sl span.done{color:var(--ink);background:#effaf5}

/* ---------- Helpers de jeu ---------- */
const P=n=>st.players.find(p=>p.name==n);
const col=n=>(P(n)||{}).color||'#888';
const explorer=()=>st.cur&&st.cur.explorer||gNextEx();
const others=n=>st.order.filter(x=>x!=n);
function mapOf(c,t,create){const m=st.maps[c]||(create?(st.maps[c]={}):{});return m[t]||(create?(m[t]=[]):[])}
const isOld=l=>Date.now()-l.date>60*864e5;
function status(c,t){const s={};ORDER.forEach(r=>s[r]={n:0,door:0,old:0});
 for(const l of mapOf(c,t)){const x=s[l.r];if(l.kind=='door')x.door++;else{x.n++;if(isOld(l))x.old++}}return s}
function openSet(c,t){const s=status(c,t),o={};
 for(const r of ORDER){const d=R[r];o[r]=(d.lvl||0)<=st.meteo&&(!d.need.length||st.mode=='esc'||d.need.some(x=>s[x].n>0))}return o}
function lockWhy(c,t,r){const d=R[r];if((d.lvl||0)>st.meteo)return T('lockMeteo');
 return T('lockNeed',{list:d.need.map(RN).join(T('or'))})}
const saveKey=names=>'terra:save:'+[...names].map(s=>s.toLowerCase()).sort().join('|');

/* ---------- Dessin ---------- */
function blob(cx,cy,rx,ry,seed,k=12,amp=.08){
 const p=[];for(let i=0;i<k;i++){const a=i/k*Math.PI*2,f=1+amp*Math.sin(seed*1.7+i*2.3)+amp*.6*Math.cos(seed*.9+i*3.1);p.push([cx+Math.cos(a)*rx*f,cy+Math.sin(a)*ry*f])}
 const m=(a,b)=>[(a[0]+b[0])/2,(a[1]+b[1])/2],F=v=>v.toFixed(1);
 let s=m(p[k-1],p[0]),d=`M${F(s[0])},${F(s[1])}`;
 for(let i=0;i<k;i++){const q=p[i],e=m(q,p[(i+1)%k]);d+=`Q${F(q[0])},${F(q[1])} ${F(e[0])},${F(e[1])}`}return d+'Z'}
function icon(r,x,y,c){
 switch(r){
 case 'plaines':return `<g stroke="${c}" stroke-width="1.4" fill="none" stroke-linecap="round" stroke-linejoin="round">${[-30,-14,2,18,32].map((o,i)=>`<path d="M${x+o-3},${y+3+(i%2)*3} l3,-7 l3,7"/>`).join('')}</g>`;
 case 'foret':return [-13,0,13].map((o,i)=>`<path d="M${x+o},${y-12+(i==1?-3:0)} l7,15 h-14z" fill="${c}"/><rect x="${x+o-1}" y="${y+3+(i==1?-3:0)}" width="2" height="4" fill="${c}"/>`).join('');
 case 'source':return `<g fill="none" stroke="${c}" stroke-width="1.3"><ellipse cx="${x}" cy="${y+2}" rx="13" ry="5"/><ellipse cx="${x}" cy="${y+2}" rx="7" ry="2.5"/></g><path d="M${x},${y-12} q5,7 0,9 q-5,-2 0,-9z" fill="${c}"/>`;
 case 'volcan':return `<path d="M${x-17},${y+8} L${x-5},${y-8} h10 L${x+17},${y+8}z" fill="${c}"/><circle class="smoke" cx="${x+2}" cy="${y-13}" r="3" fill="${c}" opacity=".5"/><circle class="smoke" cx="${x+7}" cy="${y-19}" r="4" fill="${c}" opacity=".35" style="animation-delay:.8s"/>`;
 case 'montagnes':return `<path d="M${x-26},${y+8} L${x-11},${y-9} L${x+3},${y+8}z" fill="${c}" opacity=".8"/><path d="M${x-7},${y+8} L${x+10},${y-14} L${x+27},${y+8}z" fill="${c}"/><path d="M${x+10},${y-14} l-4,5 l3,-1 l1,2 l1,-2 l3,1z" fill="#fff" opacity=".7"/>`;
 case 'grottes':return `<path d="M${x-13},${y+7} Q${x-13},${y-10} ${x},${y-10} Q${x+13},${y-10} ${x+13},${y+7}z" fill="#0b0e14" stroke="${c}" stroke-width="1.4"/>`;
 case 'horizon':return `<path d="M${x-12},${y+2} A12 12 0 0 1 ${x+12},${y+2}z" fill="${c}"/><g stroke="${c}" stroke-width="1.3" stroke-linecap="round"><path d="M${x-19},${y+3} h38"/><path d="M${x},${y-14} v-3 M${x-11},${y-9} l-2,-2 M${x+11},${y-9} l2,-2"/></g>`;
 case 'rivage':return `<g stroke="${c}" stroke-width="1.4" fill="none" stroke-linecap="round"><path d="M${x-10},${y} q2.5,-3 5,0 t5,0 t5,0 t5,0"/></g>`;
 }return ''}

function blob(cx,cy,rx,ry,seed,k=1,amp=1){const N=18,p=[];
 for(let i=0;i<N;i++){const a=i/N*Math.PI*2,f=1+amp*(.055*Math.sin(seed+i*2.3)+.035*Math.sin(seed*1.7+i*5.1));p.push([cx+Math.cos(a)*rx*k*f,cy+Math.sin(a)*ry*k*f])}
 let d=`M${p[0][0].toFixed(1)},${p[0][1].toFixed(1)}`;
 for(let i=0;i<N;i++){const p0=p[(i-1+N)%N],p1=p[i],p2=p[(i+1)%N],p3=p[(i+2)%N];

 if(typeof Peer=='undefined')return toast(T('noNet'));
 isHost=true;const code=genCode();chatLog=[];
 peer=new Peer(hid(code,0),{debug:0});
 peer.on('open',()=>{
  st={code,host:me.name,phase:'lobby',players:[{name:me.name,color:me.color,g:GN(me.g),online:true,peer:'host'}],votes:{},length:5,meteo:1,turn:0,total:0,order:[],maps:{},used:{},log:[],cur:null,flags:{},bottles:{},updatedAt:Date.now(),v:0,epoch:0};
  render()});
 wireHost(peer);
 peer.on('error',e=>{if(e.type=='unavailable-id'){peer.destroy();createGame()}else if(e.type=='network'||e.type=='server-error'||e.type=='socket-error')toast(T('srvDown'));else if(e.type!='peer-unavailable')console.warn(e)});
 app.innerHTML=`<div class="banner"><p class="serif">${T('creating')}</p><p class="mut" style="margin-top:8px">${T('netting')}</p></div>`}

/* === net : migration d'hôte === */
const hid=(code,e)=>PREFIX+code+(e?'-'+e:'');
let migrating=false,migSeq=0,lastSeen=0,onUnavail=null,beacon=null,hostSince=0,aloneSince=0,probing=false,joinCode='';
const isLinked=n=>n==me.name||Object.values(conns).some(c=>c.pname==n);
/* branche un peer hôte : connexions entrantes + reconnexion au serveur */
function wireHost(p){
 p.on('connection',c=>{
  c.on('data',d=>{if(peer===p)hostRecv(c,d)});
  c.on('close',()=>{if(peer===p)hostDrop(c)});
  c.on('error',()=>{if(peer===p)hostDrop(c)})});
 p.on('disconnected',()=>{try{if(!p.destroyed)p.reconnect()}catch(e){}})}
/* peer client (ID aléatoire) ; peer-unavailable est renvoyé à la tentative en cours */
function clientPeer(cb){
 if(peer&&!isHost&&peer.open&&!peer.destroyed)return cb();
 const p=new Peer({debug:0});peer=p;
 p.on('open',()=>{if(peer===p)cb()});
 p.on('error',e=>{if(peer!==p)return;
  if(e.type=='peer-unavailable'){const f=onUnavail;onUnavail=null;f&&f()}
  else if(e.type=='network'||e.type=='server-error'||e.type=='socket-error'){if(migrating||st)return;toast(T('srvDown'));leave()}
  else console.warn(e)});
 p.on('disconnected',()=>{try{if(!p.destroyed)p.reconnect()}catch(e){}})}
/* se connecter à un hôte ; onFail si l'ID n'existe pas, ne répond pas ou ferme avant l'état */
/* identifiant d'appareil (local) : reconnaître la même personne qui revient, sans la confondre avec un homonyme */
const DEV={};/* hôte seulement, jamais dans st */
function devId(){let v=LS.get('terra:dev',null);if(!v){v=rid()+rid();LS.set('terra:dev',v)}return v}
function connectTo(id,onFail,ms=25000){
 let got=false,done=false;const fail=()=>{if(done||got)return;done=true;if(onUnavail===fail)onUnavail=null;try{c.close()}catch(e){}if(hostConn===c)hostConn=null;onFail&&onFail()};
 onUnavail=fail;
 const c=peer.connect(id,{reliable:true});hostConn=c;
 /* WebRTC entre deux réseaux (4G, box) peut mettre >10 s à s'établir : ne pas couper trop tôt ; un code inexistant échoue tout de suite via peer-unavailable */
 setTimeout(()=>{if(!c.open)fail()},ms);
 c.on('open',()=>{lastSeen=Date.now();c.send({t:'hello',name:me.name,color:me.color,g:GN(me.g),dev:devId(),saves:allSaves(),pend:window.gPend?gPend():null})});
 c.on('data',d=>{if(hostConn!==c)return;lastSeen=Date.now();
  if(d.t=='state'){got=true;migrating=false;onUnavail=null;const ph=st&&st.host;st=d.st;if(ph&&ph!=st.host)toast(T('newHost',{n:st.host}));persist();render();window.armTimer&&armTimer()}
  else if(d.t=='react')floatReact(d.from,d.e,d)
  else if(d.t=='renamed'){me.name=d.name;setTimeout(()=>toast(T('renamed',{n:d.name})),300)}
  else if(d.t=='chat')chatAdd(d.m)
  else if(d.t=='chatlog')chatMerge(d.log)
  else if(d.t=='chatslow')toast(T('chSlow'))
  else if(d.t=='g2wait')g2Waiting(d.host)
  else if(d.t=='moved'){done=true;hostConn=null;try{c.close()}catch(e){}connectTo(hid(joinCode,d.e),onFail)}
  else if(d.t=='handoff'){st=d.st;migrate(d.to)}
  else if(d.t=='closed'){st=null;toast(T('closed'));leave()}
  else if(d.t=='err'){toast(d.k?T(d.k):d.m);leave()}});
 c.on('close',()=>{if(hostConn!==c)return;if(!got)return fail();hostConn=null;if(st&&!migrating)migrate()})}

function joinGame(code){
 if(typeof Peer=='undefined')return toast(T('noNet'));
 isHost=false;migrating=false;migSeq++;joinCode=code;chatLog=[];g2Wait=false;if(peer)try{peer.destroy()}catch(e){}peer=null;
 app.innerHTML=`<div class="banner"><p class="serif">${T('rowing',{code:esc(code)})}</p><p class="mut" style="margin-top:8px">${T('joining')}</p></div>`;
 clientPeer(()=>{const mine=peer;let e=0;
  setTimeout(()=>{if(peer===mine&&!st&&!g2Wait){toast(T('noReach'));leave()}},45000);
  /* époque 0 (le code), puis 1..4 si l'hôte a changé et que le phare n'est pas encore là */
  const tryE=()=>{if(peer!==mine||st)return;connectTo(hid(code,e),()=>{if(peer!==mine||st)return;if(++e<=4)tryE();else{toast(T('noGame',{code}));leave()}})};
  tryE()})}

/* l'hôte a disparu (ou passe la main à `to`) : tout le monde vise hid(code,epoch+1) */
function migrate(to,eForce){
 if(migrating||!st)return;
 migrating=true;const my=++migSeq,code=st.code,old=st.host,t0=Date.now(),e=eForce||(st.epoch||0)+1;joinCode=code;
 const c0=hostConn;hostConn=null;try{c0&&c0.close()}catch(x){}
 let line=st.players.filter(p=>p.online&&p.name!=old).map(p=>p.name);
 if(to&&line.includes(to))line=[to,...line.filter(n=>n!=to)];
 let k=line.indexOf(me.name);if(k<0)k=line.length;
 let claimAt=t0+k*2500,claiming=false,busy=false;
 let probed=!!to;
 const tick=()=>{
  if(!probed){probed=true;busy=true;
   /* l'hôte actuel répond-il encore ? (cas typique : téléphone revenu d'un autre onglet) */
   clientPeer(()=>{if(my!==migSeq||!migrating||isHost)return;connectTo(hid(code,e-1),()=>{if(my!==migSeq||!migrating)return;busy=false;toast(T('hostGone'));claimAt=Date.now()+k*2500;setTimeout(tick,300)},7000)});return}
  if(my!==migSeq||!migrating||isHost)return;
  if(Date.now()-t0>45000){migrating=false;toast(T('lostHost'));lostScreen(code);return}
  if(!claiming&&Date.now()>=claimAt){claiming=true;
   const p=new Peer(hid(code,e),{debug:0});
   p.on('open',()=>{if(my!==migSeq||!migrating||isHost){try{p.destroy()}catch(x){}return}becomeHost(p,e)});
   p.on('error',er=>{if(peer===p&&isHost){if(er.type=='network'||er.type=='server-error')toast(T('srvDown'));return}
    if(peer!==p){try{p.destroy()}catch(x){}claiming=false;claimAt=Date.now()+5000}})}
  if(!busy&&!isHost&&migrating){busy=true;clientPeer(()=>{if(my!==migSeq||!migrating||isHost){busy=false;return}connectTo(hid(code,e),()=>{busy=false})})}
  setTimeout(tick,900)};
 tick()}

function becomeHost(p,e){
 const old=st.host,cp=peer;
 peer=p;isHost=true;migrating=false;hostConn=null;conns={};hostSince=Date.now();aloneSince=0;
 if(cp&&cp!==p)try{cp.destroy()}catch(x){}
 st.epoch=e;st.host=me.name;
 const op=P(old);if(op&&old!=me.name){if(st.phase=='lobby'){st.players=st.players.filter(x=>x!=op);delete st.votes[old]}else op.online=false}
 const mp=P(me.name);if(mp){mp.online=true;mp.peer='host'}
 wireHost(p);
 if(st.phase=='question'&&st.cur)checkAll();
 if(st.phase=='end'){/* @qa2 : drapeaux anonymes perdus avec l'ancien hôte : à replanter */if(st.anon&&SECF.gid!==st.gid)for(const n in st.flags)if(st.flags[n]===true)st.flags[n]=false;if(MYFL.gid===st.gid&&!st.flags[me.name])gRestore(me.name,{fl:MYFL.v});gFlagsCheck(st)}
 /* @qa2 : marques de la vue filtrée (notes scellées, votes masqués) : perdues */(st.hist||[]).forEach(h=>{if(h.nt)for(const k in h.nt)if(h.nt[k]===1)delete h.nt[k];if(h.wo&&h.wo.v)for(const k in h.wo.v)if(h.wo.v[k]==='')delete h.wo.v[k]});if(st.cur&&st.cur.wo&&st.cur.wo.v)for(const k in st.cur.wo.v)if(st.cur.wo.v[k]==='')delete st.cur.wo.v[k];
 toast(T('newHost',{n:me.name}));
 bump();window.armTimer&&armTimer();
 /* ceux qui ne sont pas revenus en 12 s passent hors ligne */
 setTimeout(()=>{if(!isHost||peer!==p||!st)return;let ch=false;
  st.players.forEach(x=>{if(x.online&&!isLinked(x.name)){x.online=false;ch=true}});
  if(ch){if(st.phase=='lobby')st.players=st.players.filter(x=>x.online);if(st.phase=='question'&&st.cur)checkAll();gFlagsCheck(st);g3Hurry();bump()}},12000);
 claimBeacon()}

/* phare : reprend l'ID du code pour rediriger les retardataires vers l'hôte actuel */
function claimBeacon(){
 if(beacon||!isHost||!st||!st.epoch)return;
 const hp=peer,code=st.code,b=new Peer(hid(code,0),{debug:0});beacon=b;
 b.on('connection',c=>c.on('open',()=>{try{c.send({t:'moved',e:st&&st.epoch})}catch(x){}setTimeout(()=>{try{c.close()}catch(x){}},800)}));
 b.on('error',er=>{if(er.type=='peer-unavailable')return;if(beacon===b){beacon=null;try{b.destroy()}catch(x){}setTimeout(()=>{if(isHost&&peer===hp&&st&&st.code==code)claimBeacon()},5000)}})}
function dropBeacon(){const b=beacon;beacon=null;try{b&&b.destroy()}catch(x){}}

/* départ volontaire de l'hôte : on désigne quelqu'un en ligne */
function handoff(){if(!isHost||!st)return false;
 const h=st.players.find(p=>p.name!=me.name&&p.online&&isLinked(p.name));if(!h)return false;
 const s=JSON.parse(JSON.stringify(st)),mp=s.players.find(p=>p.name==me.name);
 if(s.phase=='lobby'){s.players=s.players.filter(p=>p!=mp);delete s.votes[me.name]}else if(mp)mp.online=false;
 for(const id in conns){const c=conns[id];if(c.open)try{c.send({t:'handoff',to:h.name,st:c.pname==h.name?s:viewFor(c.pname,s)})}catch(e){}}return true}

/* battement de cœur : ping de l'hôte, détection côté client, hôte isolé qui se découvre remplacé */
setInterval(()=>{
 if(!st)return;
 if(!isHost){if(document.hidden){lastSeen=Date.now();return}if(!migrating&&hostConn&&hostConn.open&&Date.now()-lastSeen>9000)migrate();return}
 broadcast({t:'ping'});
 if(Object.keys(conns).length||st.players.length<2){aloneSince=0;return}
 aloneSince=aloneSince||Date.now();
 if(Date.now()-aloneSince>15000&&!probing&&peer&&peer.open){probing=true;
  const hp=peer,e=(st.epoch||0)+1,c=hp.connect(hid(st.code,e),{reliable:true});
  const end=()=>{probing=false;try{c.close()}catch(x){}};setTimeout(end,6000);
  c.on('open',()=>{end();if(!isHost||peer!==hp||!st)return;
   /* quelqu'un a pris la suite : on redevient client */
   isHost=false;conns={};dropBeacon();peer=null;try{hp.destroy()}catch(x){}st.epoch=e-1;migrate(null,e)})}},3000);
window.addEventListener('pagehide',()=>{if(isHost&&st)handoff()});
/* retour sur l'onglet (téléphone) : on ne se croit pas abandonné ; si le lien est tombé, on rejoint l'hôte actuel au lieu de prendre sa place */
document.addEventListener('visibilitychange',()=>{if(document.hidden||!st||isHost)return;lastSeen=Date.now();
 if(!migrating&&(!hostConn||!hostConn.open))migrate()});

function leave(){const ho=isHost&&st&&handoff();migSeq++;migrating=false;onUnavail=null;dropBeacon();if(location.hash)history.replaceState(null,'',location.pathname+location.search);$('#modal').textContent='';lastPhaseKey='';app.classList.remove('still');const p=peer;st=null;peer=null;hostConn=null;conns={};isHost=false;chatLog=[];try{p&&(ho?setTimeout(()=>p.destroy(),400):p.destroy())}catch(e){}render()}
function lostScreen(code){st=null;app.innerHTML=`<div class="banner"><p class="serif">${T('lostT')}</p><p class="mut" style="margin-top:8px">${T('lostD')}</p>
 <div class="row" style="margin-top:20px"><button id="re">${T('retry')}</button><button class="ghost" id="home">${T('home')}</button></div></div>`;
 $('#re').onclick=()=>{try{peer.destroy()}catch(e){}joinGame(code)};$('#home').onclick=leave}

/* === net : chat de groupe (hors de st, relayé par l'hôte) === */
let chatLog=[],chatOpen=false,chatUnread=0,gifT=0;
const chatRate={};
const CH_EMO=['😀','😂','🤣','😊','🥹','😍','🥰','😘','😎','🤩','🤔','😏','😅','😬','😢','😭','😮','😱','🙈','🤗','🫂','🙏🏻','👏🏻','🙌🏻','👍🏻','👋🏻','💪🏻','✨','🔥','❤️','🧡','💛','💚','💙','💜','🌊','🏝️','⛵','🧭','🌴','🐚','🌙','⭐','🎉'];
/* comme tidy, sans majuscule forcée ni ponctuation réduite : le chat garde son ton */
const chTidy=s=>String(s??'').replace(/[\u0000-\u001f\u007f‪-‮⁦-⁩]/g,' ').replace(/\s+/g,' ').trim();
const rid=()=>Math.random().toString(36).slice(2,10)+Date.now().toString(36).slice(-4);
/* GIF accepté : https, domaines de GIF connus, fichier image/vidéo */
function cleanGif(u){try{u=String(u||'').trim();if(!u)return '';const x=new URL(u),h=x.hostname;if(x.protocol!='https:'||x.username||x.password)return '';
 if(!(/(^|\.)klipy\.com$/.test(h)||/^(media\d*|i)\.giphy\.com$/.test(h)||/^(media\d*|c)\.tenor\.com$/.test(h)))return '';
 if(!/\.(gif|webp|mp4)$/i.test(x.pathname))return '';return x.href.length<=500?x.href:''}catch(e){return ''}}
/* lien de page Giphy → fichier */
function normGif(u){const m=String(u||'').trim().match(/^https?:\/\/(?:www\.)?giphy\.com\/(?:gifs|stickers)\/(?:[\w-]*-)?(\w+)\/?$/i);return m?`https://media.giphy.com/media/${m[1]}/giphy.gif`:String(u||'').trim()}
/* côté hôte : impose l'auteur, limite le débit, nettoie */
function chatIn(from,m){if(!m||typeof m!='object'||!st)return;const now=Date.now(),r=chatRate[from]=(chatRate[from]||[]).filter(t=>now-t<10000);
 const txt=chTidy(m.txt).slice(0,300),gif=cleanGif(m.gif);if(!txt&&!gif)return;if(r.length>=5)return false;r.push(now);
 const msg={id:String(m.id||'').replace(/\W/g,'').slice(0,24)||rid(),from,txt,gif,ts:now};chatAdd(msg);broadcast({t:'chat',m:msg})}
function chatSend(txt,gif){const m={id:rid(),txt:chTidy(txt).slice(0,300),gif:cleanGif(gif)};if(!m.txt&&!m.gif)return false;
 if(isHost){if(chatIn(me.name,m)===false){toast(T('chSlow'));return false}}else if(hostConn&&hostConn.open)hostConn.send({t:'chat',m});else return false;return true}
function chatOk(m){return m&&typeof m=='object'&&typeof m.id=='string'&&typeof m.from=='string'&&(m.txt||m.gif)}
function chatAdd(m){if(!chatOk(m)||chatLog.some(x=>x.id==m.id))return;const prev=chatLog[chatLog.length-1];chatLog.push(m);if(chatLog.length>60)chatLog.shift();
 const l=$('#chat .ch-list');if(l){const near=l.scrollHeight-l.scrollTop-l.clientHeight<80;const e=l.querySelector('.ch-empty');e&&e.remove();l.appendChild(chatEl(m,prev));if(near||m.from==me.name)l.scrollTop=l.scrollHeight;while(l.children.length>60)l.firstChild.remove()}
 if(m.from!=me.name&&!chatOpen){chatUnread++;chatBadge();chatPeek(m)}}
function chatMerge(log){if(!Array.isArray(log))return;const ids=new Set(chatLog.map(x=>x.id));log.forEach(m=>{if(chatOk(m)&&!ids.has(m.id)){chatLog.push(m);ids.add(m.id)}});
 chatLog.sort((a,b)=>(a.ts||0)-(b.ts||0));chatLog=chatLog.slice(-60);chatDrawAll()}
const isEmo=s=>s.length<=16&&/^(?:\p{Extended_Pictographic}|\p{Emoji_Component}|‍|️|\s)+$/u.test(s)&&!/^[\d#*\s]+$/.test(s);
function chatEl(m,prev){const d=document.createElement('div'),mine=m.from==me.name,cont=prev&&prev.from==m.from&&m.ts-prev.ts<180000;
 d.className='ch-m'+(mine?' me':'')+(cont?' cont':'');d.style.setProperty('--pc',col(m.from));
 if(!mine&&!cont){const n=document.createElement('div');n.className='ch-n';const dot=document.createElement('span');dot.className='dot';dot.style.background=grad(col(m.from));const b=document.createElement('b');b.textContent=m.from;b.style.color=col(m.from);n.append(dot,b);d.appendChild(n)}
 const bub=document.createElement('div');bub.className='ch-bub'+(m.txt&&!m.gif&&isEmo(m.txt)?' emo':'');
 if(m.txt){const t=document.createElement('span');t.textContent=m.txt;bub.appendChild(t)}
 const g=cleanGif(m.gif);if(g){const v=/\.mp4$/i.test(new URL(g).pathname),el=document.createElement(v?'video':'img');
  if(v){el.muted=true;el.loop=true;el.autoplay=true;el.playsInline=true;el.setAttribute('playsinline','')}else{el.loading='lazy';el.alt='GIF';el.decoding='async'}
  el.referrerPolicy='no-referrer';el.className='ch-g';el.src=g;el.onclick=()=>bub.classList.toggle('big');bub.appendChild(el)}
 d.appendChild(bub);return d}
function chatDrawAll(){const l=$('#chat .ch-list');if(!l)return;l.textContent='';
 if(!chatLog.length){const e=document.createElement('p');e.className='ch-empty';e.textContent=T('chEmpty');l.appendChild(e);return}
 chatLog.forEach((m,i)=>l.appendChild(chatEl(m,chatLog[i-1])));l.scrollTop=l.scrollHeight}
function chatBadge(){$$('.ch-badge').forEach(b=>{b.textContent=chatUnread>9?'9+':chatUnread||'';b.classList.toggle('on',chatUnread>0)})}
function chatPeek(m){const p=$('#chat .ch-peek');if(!p||$('.hint.mine'))return;p.textContent='';const b=document.createElement('b');b.textContent=m.from;b.style.color=col(m.from);
 const s=document.createElement('span');s.textContent=m.txt||'GIF';p.append(b,s);p.classList.remove('on');void p.offsetWidth;p.classList.add('on');clearTimeout(p._h);p._h=setTimeout(()=>p.classList.remove('on'),2500)}
function chatToggle(v){const w=$('#chat');if(!w)return;chatOpen=v??!chatOpen;w.classList.toggle('open',chatOpen);document.body.classList.toggle('ch-open',chatOpen);
 if(chatOpen){chatUnread=0;chatBadge();const p=$('#chat .ch-peek');p&&p.classList.remove('on');const l=$('#chat .ch-list');l.scrollTop=l.scrollHeight;if(matchMedia('(min-width:1100px)').matches)setTimeout(()=>$('#chat .ch-in').focus(),50)}
 else chatPop('')}
function chatPop(k){const w=$('#chat');if(!w)return;['emo','gif'].forEach(n=>{const o=n==k&&w.querySelector('.ch-'+n).hidden;w.querySelector('.ch-'+n).hidden=!o;w.querySelector(n=='emo'?'.ch-be':'.ch-bg').classList.toggle('on',o)});
 if(k=='gif'&&!w.querySelector('.ch-gif').hidden){const q=w.querySelector('.ch-gq');q.value='';gifShow('');setTimeout(()=>q.focus(),30)}}
/* panneau GIF : recherche KLIPY si clé, sinon lien collé avec aperçu */
async function gifSearch(q){let cid=LS.get('terra:cid',null);if(!cid){cid=rid()+rid();LS.set('terra:cid',cid)}
 const loc={fr:'fr',en:'us',es:'es',it:'it',de:'de',ru:'ru',zh:'cn',he:'il',pt:'br'}[LANG]||'us';
 const r=await fetch(`https://api.klipy.com/api/v1/${encodeURIComponent(GIF_KEY)}/gifs/${q?'search':'trending'}?per_page=24&page=1&customer_id=${cid}&locale=${loc}&content_filter=medium&format_filter=gif,webp${q?'&q='+encodeURIComponent(q):''}`);
 const j=await r.json(),pick=(f,s)=>{const o=f&&f[s];const x=o&&(o.webp||o.gif);return x&&x.url};
 return ((j&&j.data&&j.data.data)||[]).map(x=>({th:pick(x.file,'sm')||pick(x.file,'xs'),u:pick(x.file,'md')||pick(x.file,'sm'),t:x.title||''})).filter(x=>x.th&&cleanGif(x.th)&&cleanGif(x.u))}
function gifShow(raw){const box=$('#chat .ch-gres');if(!box)return;const v=normGif(raw),my=++gifT;box.textContent='';
 const note=k=>{const p=document.createElement('p');p.className='ch-note';p.textContent=T(k);box.appendChild(p)};
 const tile=(th,u,alt)=>{const b=document.createElement('button');b.type='button';b.className='ch-gt';const i=document.createElement('img');i.loading='lazy';i.referrerPolicy='no-referrer';i.alt=alt||'GIF';i.src=th;b.appendChild(i);b.onclick=()=>{if(chatSend('',u))chatPop('')};box.appendChild(b);return b};
 if(/^https?:\/\//i.test(v)){const g=cleanGif(v);if(!g)return note('chGifBad');
  if(/\.mp4$/i.test(new URL(g).pathname)){const b=document.createElement('button');b.type='button';b.className='ch-gt one';const el=document.createElement('video');el.muted=el.loop=el.autoplay=true;el.playsInline=true;el.referrerPolicy='no-referrer';el.src=g;b.appendChild(el);b.onclick=()=>{if(chatSend('',g))chatPop('')};box.appendChild(b)}
  else tile(g,g).classList.add('one');note('chGifTap');return}

function constellation(){const n=st.order.length,W=400,H=n>2?260:150,cx=200,cy=H/2,rad=n>2?95:120;
 const pos={};st.order.forEach((p,i)=>{const a=n>2?-Math.PI/2+i/n*Math.PI*2:Math.PI*i;pos[p]=[cx+Math.cos(a)*rad,cy+Math.sin(a)*(n>2?rad*.9:0)]});
 let s=`<svg viewBox="0 0 ${W} ${H}" style="width:100%">`;
 for(let i=0;i<n;i++)for(let j=i+1;j<n;j++){const a=st.order[i],b=st.order[j];
  /* game2 : fil = lieux découverts entre deux personnes (dans les deux sens) ; 3 épaisseurs nettes + le chiffre */
  const w=[...mapOf(a,b),...mapOf(b,a)].filter(l=>l.kind!='door').length,[x1,y1]=pos[a],[x2,y2]=pos[b],ti=g2Tier(w);
  if(!w){s+=`<line x1="${x1}" y1="${y1}" x2="${x2}" y2="${y2}" stroke="#b9a68a" stroke-width="2" stroke-dasharray="2 7" stroke-linecap="round" opacity=".7"/>`;continue}
